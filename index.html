<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Mock Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h2>GATE MOCK <span style="color:var(--primary)">PRO</span></h2>
        <div id="timer">10:00</div>
        <button id="exitBtn">Exit</button>
    </header>

    <main id="app">
        <section id="start" class="screen active">
            <div class="card center">
                <h1>GATE Mock Session</h1>
                <p style="color:#94a3b8; margin-bottom: 20px;">10 Randomized Questions | 10 Minutes | Focus Mode</p>
                <button id="startBtn">Start Test</button>
            </div>
        </section>

        <section id="quiz" class="screen">
            <div class="quiz-container">
                <div class="main-content">
                    <div class="card">
                        <div class="q-meta"><span id="progress"></span><span id="subject-tag"></span></div>
                        <h2 id="question">Loading...</h2>
                        <div id="options"></div>
                        <div id="solution-box">
                            <h4 style="color:var(--primary); margin-bottom:5px;">Detailed Solution</h4>
                            <p id="solution-text" style="font-size:0.9rem; color:#cbd5e1;"></p>
                        </div>
                    </div>
                </div>
                <aside class="sidebar">
                    <h3>Status Palette</h3>
                    <div id="palette"></div>
                    <button id="markBtn" style="background:#6366f1">Review Later</button>
                    <button id="submitBtn" style="background:#22c55e; margin-top:10px;">Submit Exam</button>
                </aside>
            </div>
            <div class="mobile-nav">
                <button id="prevBtn">Prev</button>
                <button id="nextBtn">Next</button>
            </div>
        </section>

        <section id="result" class="screen">
            <div class="card center">
                <h2>Analysis Complete</h2>
                <h1 id="scoreText"></h1>
                <div id="analysis" class="stats-grid"></div>
                <button id="restartBtn">Take New Mock</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
