<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE Mock Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

<!-- START -->
<section id="start" class="screen active">
  <div class="card center">
    <h1>GATE MOCK TEST</h1>
    <p>Focus Mode Practice</p>
    <button id="startBtn">Start Test</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">

  <!-- LEFT PANEL -->
  <div class="main-panel">

    <div class="top-bar">
      <div id="progress"></div>
      <div id="timer"></div>
    </div>

    <div class="question-box">
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>

  </div>

  <!-- RIGHT PANEL (DESKTOP) -->
  <div class="side-panel">
    <h3>Questions</h3>
    <div id="palette"></div>
    <button id="submitBtn">Submit Test</button>
  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav">
    <button id="prevBtn">Prev</button>
    <button id="markBtn">Mark</button>
    <button id="nextBtn">Next</button>
  </div>

</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="card center">
    <h2>Result</h2>
    <p id="scoreText"></p>
    <div id="analysis"></div>
    <button onclick="location.reload()">Restart</button>
  </div>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
