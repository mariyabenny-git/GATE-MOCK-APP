<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE Mock Pro</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="script.js"></script>
</head>

<body>

<header class="header">
  <h2>GATE MOCK PRO</h2>
  <div id="timer">30:00</div>
  <button id="exitBtn">Exit</button>
</header>

<main>

<!-- LOGIN -->
<section id="login" class="screen active login-screen">
  <div class="card center">
    <h2>Welcome</h2>
    <input id="username" class="input-field" placeholder="Enter your name">
    <button id="loginBtn" class="btn-primary">Login</button>
  </div>
</section>

<!-- START -->
<section id="start" class="screen">
  <div class="card center">
    <h2>Hello <span id="userText"></span> 👋</h2>

    <select id="difficulty" class="input-field">
      <option value="all">All</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button id="startBtn">Start Test</button>

    <p id="history"></p>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">
  <div class="quiz-container">

    <div class="card">
      <p id="progress"></p>

      <h2 id="question"></h2>

      <div style="text-align:right;">
        <button id="explainBtn">💡</button>
      </div>

      <div id="options"></div>

      <div class="nav-inside">
        <button id="prevBtn">Prev</button>
        <button id="markBtn">Mark</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>

    <aside class="card sidebar">
      <h3>Palette</h3>
      <div id="palette"></div>
      <button id="submitBtn">Submit</button>
    </aside>

  </div>
</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="card center">

    <h2>Performance Dashboard</h2>

    <p id="scoreText"></p>
    <p id="airText"></p>
    <p id="weakText"></p>

    <canvas id="donutChart"></canvas>
    <canvas id="timeChart"></canvas>

    <button id="reviseBtn">🔁 Revise Weak Topics</button>

    <h3>📘 Golden Corner</h3>
    <div id="solutions"></div>

    <button id="restartBtn">Restart</button>

  </div>
</section>

</main>

</body>
</html>
