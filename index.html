<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATE Mock Pro - Assignment</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="script.js"></script>
</head>
<body>

  <header class="header">
    <h2>GATE MOCK PRO</h2>
    <button id="logoutBtn" class="hidden">Logout</button>
  </header>

  <main>
    <section id="auth" class="screen active">
      <div class="auth-container">
        
        <div id="login-box" class="form-box">
          <h2>Welcome Back</h2>
          <input id="login-username" placeholder="Username">
          <input id="login-password" type="password" placeholder="Password">
          <button id="loginBtn" class="btn-accent">Login</button>
          <p>New user? <span id="toSignup">Sign up</span></p>
        </div>

        <div id="signup-box" class="form-box hidden">
          <h2>Create Account</h2>
          <input id="signup-username" placeholder="Username">
          <input id="signup-password" type="password" placeholder="Password">
          <button id="signupBtn" class="btn-accent">Sign Up</button>
          <p>Already a user? <span id="toLogin">Login</span></p>
        </div>

      </div>
    </section>

    <section id="start" class="screen">
      <div class="card center">
        <h2>Hello <span id="userText"></span> 👋</h2>
        <div id="history-section"></div>
        <button id="startBtn" class="btn-accent">Start Mock Test</button>
      </div>
    </section>

    <section id="quiz" class="screen">
      <div class="card quiz-card">
        <div class="timer-wrapper">
          <div id="timer-bar"></div>
        </div>

        <div class="quiz-header">
          <p id="progress">Question 1 of 10</p>
          <div id="timer-text">00:30</div>
        </div>
        
        <h2 id="question">Loading question...</h2>
        <div id="options" class="options-container"></div>

        <div class="nav">
          <button id="prevBtn">Prev</button>
          <button id="nextBtn">Next</button>
        </div>

        <button id="submitBtn" class="btn-accent">Submit Test</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="card center">
        <h2>Performance Dashboard</h2>
        <p id="scoreText"></p>
        
        <div class="chart-container">
          <canvas id="chart"></canvas>
        </div>

        <h3>Leaderboard Comparison</h3>
        <div class="chart-container wide">
          <canvas id="leaderboardChart"></canvas>
        </div>
        
        <button id="restartBtn" class="btn-accent">Practice Again</button>
      </div>
    </section>
  </main>

</body>
</html>
