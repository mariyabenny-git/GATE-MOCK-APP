<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE Mock Pro</title>

<link rel="stylesheet" href="style.css">

<!-- Premium Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>

<header class="header">
  <h2>GATE MOCK PRO</h2>
  <div id="timer">30:00</div>
  <button id="exitBtn">Exit</button>
</header>

<main>

<!-- START -->
<section id="start" class="screen active">
  <div class="card center">
    <h1>Focus Mode Exam</h1>
    <button id="startBtn">Start Test</button>
  </div>
</section>

<!-- QUIZ -->
<section id="quiz" class="screen">

  <div class="quiz-container">

    <div class="card" id="questionCard">
      <p id="progress"></p>
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>

    <aside class="card sidebar">
      <h3>Palette</h3>
      <div id="palette"></div>
      <button id="submitBtn">Submit</button>
    </aside>

  </div>

  <div class="mobile-nav">
    <button id="prevBtn">Prev</button>
    <button id="markBtn">Mark</button>
    <button id="nextBtn">Next</button>
  </div>

</section>

<!-- RESULT -->
<section id="result" class="screen">
  <div class="card center">

    <h2>Performance Dashboard</h2>

    <p id="scoreText"></p>
    <p id="rankText"></p>

    <canvas id="donutChart" width="250" height="250"></canvas>
    <canvas id="timeChart" width="300" height="200"></canvas>

    <div id="analysis"></div>

    <button id="restartBtn">Restart</button>

  </div>
</section>

</main>

<script defer src="script.js"></script>
</body>
</html>
