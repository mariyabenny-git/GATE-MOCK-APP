<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE Mock Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h2>GATE MOCK</h2>
  <div id="timer"></div>
  <button onclick="location.reload()">Exit</button>
</header>

<div id="app">

<section id="start" class="screen active">
  <div class="card center">
    <h1>Focus Mode Exam</h1>
    <button id="startBtn">Start Test</button>
  </div>
</section>

<section id="quiz" class="screen">

  <div class="main">
    <div class="card">
      <h2 id="question"></h2>
      <div id="options"></div>
    </div>
  </div>

  <div class="sidebar">
    <h3>Palette</h3>
    <div id="palette"></div>
    <button id="submitBtn">Submit</button>
  </div>

  <div class="mobile-nav">
    <button id="prevBtn">Prev</button>
    <button id="markBtn">Mark</button>
    <button id="nextBtn">Next</button>
  </div>

</section>

<section id="result" class="screen">
  <div class="card center">
    <h2>Your Score</h2>
    <svg width="120" height="120">
      <circle cx="60" cy="60" r="50" stroke="#333" stroke-width="10" fill="none"/>
      <circle id="progressCircle" cx="60" cy="60" r="50"
        stroke="#6c63ff" stroke-width="10"
        fill="none"
        stroke-dasharray="314"
        stroke-dashoffset="314"/>
    </svg>

    <canvas id="donutChart" width="200" height="200"></canvas>
    <canvas id="barChart" width="300" height="150"></canvas>

    <p id="scoreText"></p>
    <button onclick="location.reload()">Restart</button>
  </div>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
