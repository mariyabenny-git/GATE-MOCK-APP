<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATE Mock Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h2>GATE MOCK PRO</h2>
        <div id="timer">30:00</div>
        <button id="exitBtn" class="small-btn">Exit</button>
    </header>

    <main id="app">
        <section id="start" class="screen active">
            <div class="card center">
                <h1>Focus Mode Exam</h1>
                <p>20 Marks | 30 Minutes</p>
                <button id="startBtn">Start Test</button>
            </div>
        </section>

        <section id="quiz" class="screen">
            <div class="quiz-container">
                <div class="main-content">
                    <div class="card">
                        <div class="top-bar">
                            <span id="progress"></span>
                        </div>
                        <h2 id="question"></h2>
                        <div id="options"></div>
                    </div>
                </div>

                <aside class="sidebar">
                    <h3>Question Palette</h3>
                    <div id="palette"></div>
                    <button id="submitBtn" class="submit-btn">Submit Test</button>
                </aside>
            </div>

            <div class="mobile-nav">
                <button id="prevBtn">Prev</button>
                <button id="markBtn">Mark</button>
                <button id="nextBtn">Next</button>
            </div>
        </section>

        <section id="result" class="screen">
            <div class="card center">
                <h2>Performance Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span id="scoreText"></span>
                    </div>
                    <div class="stat-item">
                        <span id="rankText"></span>
                    </div>
                </div>
                <div id="analysis" class="analysis-box"></div>
                <button id="restartBtn">Try Again</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
