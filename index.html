<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GATE Mock Pro | Focus Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">GATE<span>PRO</span></div>
        <div id="timer" class="timer-box">30:00</div>
        <button id="exitBtn" class="danger-btn">Exit</button>
    </header>

    <main id="app-container">
        <section id="start-screen" class="screen active">
            <div class="glass-card center">
                <h1>GATE Mock Session</h1>
                <p>10 Randomized Questions | 30 Minutes | Focus Mode</p>
                <button id="startBtn" class="primary-btn" disabled>Loading Questions...</button>
            </div>
        </section>

        <section id="quiz-screen" class="screen">
            <div class="quiz-layout">
                <div class="question-area">
                    <div class="glass-card q-card">
                        <div class="q-header">
                            <span id="q-progress"></span>
                            <span id="q-subject"></span>
                        </div>
                        <h2 id="q-text"></h2>
                        <div id="q-options" class="options-grid"></div>
                    </div>
                </div>
                
                <aside class="palette-sidebar">
                    <h3>Question Palette</h3>
                    <div id="palette-grid"></div>
                    <div class="sidebar-footer">
                        <button id="submitBtn" class="success-btn">Submit Exam</button>
                    </div>
                </aside>
            </div>

            <div class="mobile-actions">
                <button id="prevBtn">← Previous</button>
                <button id="markBtn">Mark</button>
                <button id="nextBtn">Next →</button>
            </div>
        </section>

        <section id="result-screen" class="screen">
            <div class="glass-card center">
                <div class="result-header">
                    <h2>Exam Completed</h2>
                    <div id="score-circle" class="score-display">0%</div>
                </div>
                <div id="analysis-report" class="report-box"></div>
                <button id="restartBtn" class="primary-btn">New Mock Test</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
